<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SE Bridge | SE Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFFFF;--wash:#F9F7F5;--surface:#FFFFFF;--surface-2:#F3F1EF;--blue:#00A2B1;--blue-ink:#00727D;--on-blue:#FFFFFF;--blue-soft:#E2F4F6;--plum:#432844;--muted:#6D6E71;--line:#E4E1DF;--line-strong:#CEC8C6;--red:#E41A2E;--red-dark:#AB1323;--red-soft:#FDECEE;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121718;--wash:#1A2022;--surface:#1A2022;--surface-2:#232B2E;--blue:#2CC3D1;--blue-ink:#5FD3DE;--on-blue:#06292D;--blue-soft:#133034;--plum:#EDE6EE;--muted:#A5AAAD;--line:#2E383B;--line-strong:#3E4A4E;--red:#FF5A68;--red-dark:#FF8A94;--red-soft:#3A1C20;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121718;--wash:#1A2022;--surface:#1A2022;--surface-2:#232B2E;--blue:#2CC3D1;--blue-ink:#5FD3DE;--on-blue:#06292D;--blue-soft:#133034;--plum:#EDE6EE;--muted:#A5AAAD;--line:#2E383B;--line-strong:#3E4A4E;--red:#FF5A68;--red-dark:#FF8A94;--red-soft:#3A1C20;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--plum);font:400 17px/1.55 "Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.2;color:var(--plum)}
h1{font-size:clamp(2rem,4.4vw,2.9rem);letter-spacing:-.015em}
h2{font-size:1.75rem}h3{font-size:1.2rem}h4{font-size:1.02rem}
p{margin:.4em 0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
code{font-size:.85em;background:var(--surface-2);padding:.05rem .35rem;border-radius:5px;word-break:break-all}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:0 auto;padding:.6rem 1.25rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:.9rem;background:none;border:0;padding:0;cursor:pointer}
.brand img{height:40px;width:auto;display:block}
.divider{width:1px;height:30px;background:var(--line-strong)}
nav{display:flex;gap:.2rem;margin-left:auto;overflow-x:auto;max-width:100%}
nav button{background:none;border:0;padding:.5rem .8rem;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap;font-weight:600}
nav button[aria-current="page"]{background:var(--blue-soft);color:var(--blue-ink)}
main{max-width:1240px;margin:0 auto;padding:1.8rem 1.25rem 5rem}
footer{max-width:1240px;margin:0 auto;padding:0 1.25rem 2.5rem;color:var(--muted);font-size:.88rem;display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.page-head{margin-bottom:1.3rem}
.page-head .row{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
.rule::after{content:"";display:block;width:44px;height:3px;background:var(--red);border-radius:2px;margin-top:.5rem}
.muted{color:var(--muted)}.small{font-size:.9rem}.tiny{font-size:.8rem}
.btn{border:1px solid var(--blue-ink);background:var(--blue-ink);color:var(--on-blue);padding:.6rem 1.1rem;border-radius:10px;cursor:pointer;font-weight:700;min-height:44px}
.btn.ghost{background:transparent;color:var(--blue-ink)}
.btn.sm{padding:.35rem .75rem;font-size:.92rem;min-height:36px}
.btn.danger{border-color:var(--red-dark);color:var(--red-dark);background:transparent}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--blue-ink);text-decoration:underline;cursor:pointer;font-weight:600}
.btns{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-top:.9rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.3rem}
.gap>*+*{margin-top:1.1rem}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:.9rem}
label{display:block;font-weight:600;margin:.8rem 0 .3rem;font-size:.95rem}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;padding:.6rem .7rem;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);min-height:44px}
textarea{min-height:120px;font-size:.85rem;line-height:1.45}
input[type=range]{width:100%;accent-color:var(--blue-ink)}
.hint{font-size:.85rem;color:var(--muted);margin-top:.25rem}
.err{color:var(--red-dark);font-size:.92rem;margin-top:.45rem}
.ok{background:var(--blue-soft);border-radius:10px;padding:.75rem 1rem;margin-top:.8rem}
.warn{background:var(--red-soft);color:var(--red-dark);border-radius:10px;padding:.75rem 1rem;margin-top:.8rem}
.soft{background:var(--wash);border-radius:12px;padding:1rem}
.stat{background:var(--surface-2);border-radius:12px;padding:.9rem 1rem}
.stat .n{font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.stat .l{font-size:.86rem;color:var(--muted)}
.stat .n.hid{font-size:1.15rem;padding:.25rem 0}
.meter{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin:.35rem 0}
.meter>span{display:block;height:100%;background:var(--blue);transition:width .3s}
.meter.hot>span{background:var(--red)}
.hbar{display:grid;grid-template-columns:9.5rem 1fr 3.4rem;gap:.6rem;align-items:center;font-size:.92rem;margin:.3rem 0}
.hbar .meter{margin:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th{text-align:left;padding:.5rem .6rem;border-bottom:2px solid var(--line);font-weight:700}
td{padding:.5rem .6rem;border-bottom:1px solid var(--line);vertical-align:top}
td.hr{background:var(--blue-soft)}
.scen{border:1px solid var(--line);border-radius:12px;padding:1rem}
.scen.mid{border:2px solid var(--blue-ink)}
.scen .n{font-size:1.65rem;font-weight:700;font-variant-numeric:tabular-nums}
.subtabs{display:flex;gap:.2rem;border-bottom:1px solid var(--line);margin:0 0 1.3rem;overflow-x:auto}
.subtabs button{background:none;border:0;border-bottom:3px solid transparent;padding:.6rem .9rem;cursor:pointer;color:var(--muted);font-weight:600;white-space:nowrap}
.subtabs button[aria-selected="true"]{color:var(--blue-ink);border-bottom-color:var(--blue)}
.product-logo{display:inline-flex;align-items:center;gap:.5rem}
.product-logo svg{flex:none;display:block}
.wordmark{color:var(--blue-ink);font-weight:600;white-space:nowrap}
.wordmark b{color:var(--plum);font-weight:700}
.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:2.4rem;align-items:center;padding:1rem 0 2rem}
.lead{font-size:1.15rem;color:var(--muted);max-width:36em}
.steps-list{counter-reset:s;list-style:none;padding:0;margin:0}
.steps-list li{counter-increment:s;display:grid;grid-template-columns:2rem 1fr;gap:.6rem;padding:.55rem 0;border-bottom:1px solid var(--line)}
.steps-list li:last-child{border-bottom:0}
.steps-list li::before{content:counter(s);width:1.7rem;height:1.7rem;border-radius:50%;background:var(--blue-soft);color:var(--blue-ink);font-weight:700;display:grid;place-items:center;font-size:.9rem}
.phone{width:100%;max-width:400px;margin:0 auto;background:var(--surface);border:1px solid var(--line-strong);border-radius:30px;padding:1.2rem 1.1rem 1.4rem;position:relative}
.phone-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:.8rem}
.progress{display:flex;gap:.35rem;margin:.2rem 0 1rem}
.progress span{flex:1;height:5px;border-radius:9px;background:var(--surface-2)}
.progress span.on{background:var(--blue)}
.chips{display:flex;flex-wrap:wrap;gap:.45rem;margin:.6rem 0}
.chip{border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;padding:.45rem .85rem;cursor:pointer;text-align:left;font-size:.95rem}
.chip[aria-pressed="true"]{background:var(--blue-soft);border-color:var(--blue-ink);font-weight:600}
.chip.rm::after{content:" ×";color:var(--muted)}
.svc{display:grid;gap:.5rem}
.svc button{display:grid;grid-template-columns:2.2rem 1fr;gap:.6rem;text-align:left;align-items:center;border:1px solid var(--line-strong);background:var(--surface);border-radius:12px;padding:.7rem .8rem;cursor:pointer}
.svc button[aria-pressed="true"]{border:2px solid var(--blue-ink);background:var(--blue-soft)}
.svc .ic{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--blue-soft);display:grid;place-items:center;color:var(--blue-ink)}
.svc b{display:block}.svc span.d{font-size:.86rem;color:var(--muted)}
.check{display:flex;gap:.6rem;align-items:flex-start;margin-top:1rem;font-weight:400}
.check input{margin-top:.3rem;width:20px;height:20px;accent-color:var(--blue-ink);flex:none}
.visit{border:1px solid var(--line);border-radius:12px;padding:.8rem .95rem;margin-top:.6rem}
.visit .top{display:flex;justify-content:space-between;gap:.5rem;align-items:baseline;flex-wrap:wrap}
.tag{display:inline-block;font-size:.8rem;padding:.1rem .55rem;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:600}
.tag.live{background:var(--blue-soft);color:var(--blue-ink)}
.arrival{background:var(--blue-ink);color:var(--on-blue);border-radius:14px;padding:.85rem 1rem;margin:.6rem 0;display:flex;gap:.6rem;align-items:center}
.arrival b{color:inherit}
.summary dt{font-size:.82rem;color:var(--muted);margin-top:.6rem}
.summary dd{margin:0;display:flex;justify-content:space-between;gap:.5rem;font-weight:600}
.summary dd .link{font-size:.85rem}
.modal-bg{position:absolute;inset:0;background:rgba(30,20,30,.45);border-radius:30px;display:flex;align-items:flex-end;padding:.6rem;z-index:3}
.modal{background:var(--surface);border-radius:20px;padding:1.1rem;width:100%}
.stars{display:flex;gap:.3rem;margin:.4rem 0}
.stars button{background:none;border:0;cursor:pointer;padding:.15rem;min-width:40px;min-height:40px}
.live{display:grid;grid-template-columns:minmax(240px,1fr) 2fr;gap:1.1rem}
.live-now{background:var(--blue-soft);border-radius:18px;padding:1.3rem;display:flex;flex-direction:column;gap:.7rem}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blue);display:inline-block;position:relative;margin-right:.45rem}
.dot.on::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--blue);animation:ping 1.8s ease-out infinite}
@keyframes ping{from{transform:scale(.5);opacity:1}to{transform:scale(1.6);opacity:0}}
.big{font-size:clamp(3rem,7vw,4.6rem);font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big.hid{font-size:1.55rem;line-height:1.2}
.tm{display:grid;grid-template-columns:auto 1fr auto;gap:1rem;align-items:center;background:var(--plum);color:#fff;border-radius:16px;padding:1rem 1.2rem}
:root:not([data-theme="light"]) .tm{background:var(--surface-2);color:var(--plum)}
.tm .day{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tm input[type=range]{accent-color:var(--blue)}
.tm .btn{background:var(--blue);border-color:var(--blue);color:#fff}
.chart{width:100%;height:190px;display:block}
.split{display:grid;grid-template-columns:420px 1fr;gap:1.4rem;align-items:start}
.split .side-head{display:flex;align-items:center;gap:.6rem;margin-bottom:.7rem}
.pipe{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.pipe .stage{border-radius:14px;padding:1rem;background:var(--wash);border:1px solid var(--line)}
.pipe .stage.bridge{background:var(--blue-soft);border-color:transparent}
.pipe .stage h4{margin-bottom:.35rem}
.fab{position:fixed;right:calc(1.2rem + env(safe-area-inset-right,0px));bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));z-index:8}
.fab>.btn{box-shadow:0 6px 18px rgba(67,40,68,.25)}
.sim{position:fixed;right:calc(1.2rem + env(safe-area-inset-right,0px));bottom:calc(4.8rem + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 2.4rem));max-height:70vh;overflow:auto;z-index:8;background:var(--surface);border:1px solid var(--line-strong);border-radius:16px;padding:1rem;box-shadow:0 10px 30px rgba(67,40,68,.2)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--plum);color:var(--bg);padding:.7rem 1.1rem;border-radius:10px;max-width:90vw;z-index:20;font-size:.95rem}
@media (max-width:1000px){.split{grid-template-columns:1fr}.pipe{grid-template-columns:1fr 1fr}}
@media (max-width:820px){.hero,.g2,.live{grid-template-columns:1fr}.g3,.g4{grid-template-columns:1fr 1fr}.hbar{grid-template-columns:7.5rem 1fr 3rem}.tm{grid-template-columns:1fr}.brand img{height:32px}}
@media (max-width:520px){.g3,.g4,.pipe{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.dot.on::after{animation:none}.meter>span{transition:none}}
</style>
</head>

<script>
// ---------- Constants and assumptions ----------
const RATE_DEFAULT=38, CAP=10, MIN=5, DAYCOST=300, POOL_DEFAULT=300;
// Rough minutes per request, used to warn when a to-do list won't fit the hours booked.
const TASK_MIN={'Light housekeeping':60,'Laundry':45,'Prepare a meal':45,'Grocery run':60,'Pick up a prescription':30,'Companionship and conversation':60,'Go along to an appointment':90,'Help moving around the home':30,'Reminders for the day':15,'Garden or snow clearing':60};
const taskMin=t=>TASK_MIN[t]||30;
// Requests a PSW usually can't take on. Flagged to the employee and the provider, never to HR.
const OUT_OF_SCOPE=/\b(mov(e|ing)\b.{0,30}\b(out|house|apartment|condo|furniture|boxes|couch|sofa)|moving day|furniture|heavy lifting|pack(ing)? boxes|truck|renovat\w*|paint(ing)? (the )?(walls?|house|room)|roof|repair\w*|plumbing|electrical|babysit\w*|pet sitting|dog walk\w*|walk\w* (my |the )?dogs?|party|airport|business|my work|cash|banking|lawyer|injection|medication change)\b/i;
const flagged=t=>OUT_OF_SCOPE.test(t);
const normDept=d=>{const c=String(d||'').trim().replace(/\s+/g,' ').toLowerCase();return c?c.replace(/(^|[\s\-\/])([a-z])/g,(m,a,b)=>a+b.toUpperCase()):'Not specified'};
const SERVICES=[
 {id:'household',name:'Household help',d:'Cleaning, laundry, meals'},
 {id:'companion',name:'Companionship',d:'Visits, conversation, outings'},
 {id:'personal',name:'Personal care',d:'Help washing, dressing, moving'},
 {id:'errands',name:'Errands and outings',d:'Groceries, prescriptions, rides'},
 {id:'rest',name:'Respite so family can rest',d:'Someone stays while you take a break'}];
const SVC_W={household:.47,companion:.30,personal:.18,errands:.03,rest:.02};
const TASKS=['Light housekeeping','Laundry','Prepare a meal','Grocery run','Pick up a prescription','Companionship and conversation','Go along to an appointment','Help moving around the home','Reminders for the day','Garden or snow clearing'];
const ROSTER={'SE Health':['Grace','Amina','Daniel','Mei'],'Northway Home Support':['Luis','Priya','Samuel','Tomás']};
const TIMES=Array.from({length:27},(_,i)=>`${String(7+Math.floor(i/2)).padStart(2,'0')}:${i%2?'30':'00'}`);
const ICON={household:'M4 11 12 4l8 7v9h-5v-6H9v6H4z',companion:'M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z',personal:'M12 4a3 3 0 1 1 0 6 3 3 0 0 1 0-6zm-6 16c0-4 3-6 6-6s6 2 6 6',errands:'M5 7h14l-1.5 10h-11zM9 7V5a3 3 0 0 1 6 0v2',rest:'M12 3a7 7 0 1 0 8 8A6 6 0 0 1 12 3z'};

// ---------- State ----------
const S={view:'overview',pulseTab:'estimate',rate:RATE_DEFAULT,pool:POOL_DEFAULT,
 est:{headcount:100,uptake:25,high:45,avg:7},
 csv:'',preview:null,upload:null,staff:[],
 me:null,attest:false,step:'signin',
 wiz:null,bookings:[],showReview:false,review:{stars:0,saved:null},

 log:[],simOpen:false,err:{}};
let KEY=null;

// ---------- Helpers ----------
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+Math.round(n).toLocaleString('en-CA');
const num=n=>Math.round(n).toLocaleString('en-CA');
const sup=n=>n<MIN?null:n;
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const at=(date,time)=>new Date(`${date}T${time}:00`);
const fmtTime=t=>{const[h,m]=t.split(':').map(Number);return`${h%12||12}:${pad(m)} ${h<12?'a.m.':'p.m.'}`};
const fmtClock=d=>fmtTime(`${pad(d.getHours())}:${pad(d.getMinutes())}`);
const fmtDate=s=>new Date(s+'T12:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'});
const svc=id=>SERVICES.find(s=>s.id===id);
function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3400)}
function log(emp,bridge,hr){S.log.unshift({emp,bridge,hr,t:fmtClock(new Date())});S.log=S.log.slice(0,10)}
async function initKey(){try{KEY=await crypto.subtle.generateKey({name:'HMAC',hash:'SHA-256'},false,['sign'])}catch(e){KEY=null}}
async function tokenFor(v){const data=new TextEncoder().encode(String(v).trim().toLowerCase());if(KEY){const sig=await crypto.subtle.sign('HMAC',KEY,data);return[...new Uint8Array(sig)].slice(0,8).map(b=>b.toString(16).padStart(2,'0')).join('')}let x=2166136261;for(const b of data){x^=b;x=Math.imul(x,16777619)>>>0}return x.toString(16).padStart(16,'0')}

// ---------- Logos ----------
const LEAF='M12 1 L13.4 4.2 L15.2 3.4 L14.6 8.2 L17.6 5.6 L18.2 7.4 L21.4 6.8 L20.4 10 L22 11 L17.4 14.8 L18 16.6 L13 15.8 L12.6 15.9 L12.6 22.5 L11.4 22.5 L11.4 15.9 L11 15.8 L6 16.6 L6.6 14.8 L2 11 L3.6 10 L2.6 6.8 L5.8 7.4 L6.4 5.6 L9.4 8.2 L8.8 3.4 L10.6 4.2 Z';
const arcY=x=>{const t=(x-4)/36;return(32-56*t*(1-t)).toFixed(1)};
function mark(kind,size){let m;
 if(kind==='shield')m=`<path d="M22 4 L38 10 V22 C38 32 31 39 22 43 C13 39 6 32 6 22 V10 Z" fill="var(--blue)"/><path d="M22 30 C15 25 13 22 13 19 C13 16.5 15 15 17 15 C19 15 21 16.3 22 18 C23 16.3 25 15 27 15 C29 15 31 16.5 31 19 C31 22 29 25 22 30 Z" fill="#fff"/>`;
 else if(kind==='pulse')m=`<circle cx="22" cy="22" r="18" fill="var(--blue)"/><polyline points="8,23 14,23 17,15 22,31 26,18 29,23 36,23" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;
 else m=[10,16,22,28,34].map(x=>`<line x1="${x}" y1="${arcY(x)}" x2="${x}" y2="33" stroke="var(--blue)" stroke-width="1.6"/>`).join('')+`<path d="M4 32 Q22 4 40 32" fill="none" stroke="var(--blue)" stroke-width="4.5" stroke-linecap="round"/><path d="M2 33.5 H42" stroke="var(--plum)" stroke-width="4" stroke-linecap="round"/>`;
 return`<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${m}<g transform="translate(30 29) scale(0.75)"><path d="${LEAF}" fill="var(--red)" stroke="#fff" stroke-width="3" stroke-linejoin="round" paint-order="stroke"/></g></svg>`}
const logo=(kind,size=34)=>`<span class="product-logo">${mark(kind,size)}<span class="wordmark" style="font-size:${(size*.56).toFixed(1)}px"><b>SE</b> ${{bridge:'Bridge',pulse:'Pulse',shield:'Shield'}[kind]}</span></span>`;
const leaf=s=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><path d="${LEAF}" fill="var(--red)"/></svg>`;
const icon=id=>`<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${ICON[id]}"/></svg>`;

// ---------- Sample staff list (synthetic) ----------
const FIRST=['amara','ben','chen','dalia','ethan','fatima','gabriel','hana','ivan','jasmin','kwame','leah','mateo','nadia','omar','priya','quinn','rosa','sanjay','tess'];
const LAST=['singh','tremblay','nguyen','okafor','roy','martin','li','patel','gagnon','hassan'];
function sampleCSV(){const plan=[['Nursing',40,4],['Personal support',34,6],['Administration',18,1],['Facilities',12,1],['Finance',3,0]];const r=['email,department,benefits_eligible'];let i=0;
 for(const[d,n,casual]of plan)for(let k=0;k<n;k++){r.push(`${FIRST[i%20]}.${LAST[(i*7)%10]}${i}@maplecare.ca,${d},${k<casual?'no':'yes'}`);i++}
 r.push('not-an-email,Nursing,yes');r.push(r[1]);return r.join('\n')}
const DEMO_EMAIL='ethan.gagnon4@maplecare.ca';

// ---------- Booking rules ----------
const postalOk=p=>/^[ABCEGHJ-NPRSTVXY]\d[A-Z] ?\d[A-Z]\d$/i.test(p.trim());
function coverage(p){const s=p.toUpperCase().replace(/\s/g,'');const rural=s[1]==='0';return{postal:s.slice(0,3)+' '+s.slice(3),rural,provider:rural?'Northway Home Support':'SE Health',noticeH:rural?48:3}}
function windowFor(rural){const now=new Date();const min=new Date(now.getTime()+(rural?48:3)*3600e3);const max=new Date(now);max.setDate(max.getDate()+7);max.setHours(20,0,0,0);return{min,max}}
function timesFor(date,rural){const{min,max}=windowFor(rural);return TIMES.filter(t=>{const d=at(date,t);return d>=min&&d<=max})}
function datesFor(rural){const out=[];const d=new Date();for(let i=0;i<=7;i++){const x=new Date(d);x.setDate(d.getDate()+i);const s=ymd(x);if(timesFor(s,rural).length)out.push(s)}return out}
const changeDeadline=b=>new Date(at(b.date,b.time).getTime()-24*3600e3);
const canChange=b=>(b.status==='booked'||b.status==='pending')&&new Date()<changeDeadline(b);
const myHours=()=>S.bookings.filter(b=>b.status!=='cancelled'&&b.status!=='declined').reduce((a,b)=>a+b.hours,0);

// ---------- Synthetic pilot model for the time machine ----------
function synth(day){const E=S.staff.length;if(!E)return null;const d=Math.max(0,Math.min(90,day));
 // Synthetic pilot that does a bit better than the expected estimate (1.5x), so demand can outgrow the pool.
 const finalUsers=E*.325*S.est.uptake/100*1.5;const ease=(k)=>(1-Math.exp(-d/k))/(1-Math.exp(-90/k));
 const enrolled=Math.round(finalUsers*1.3*ease(20));
 const users=Math.round(finalUsers*ease(22)*Math.min(1,d/8));
 const demand=finalUsers*S.est.avg*Math.pow(d/90,1.25);
 const delivered=Math.round(Math.min(demand,S.pool*.97));
 const committed=Math.round(Math.min(S.pool,delivered*1.08+(d>3?2:0)));
 const poolWait=Math.max(0,Math.round((demand*1.08-S.pool)/3));
 const visits=Math.round(delivered/2.8);
 const answered=Math.round(visits*.78),saved=Math.round(visits*.5),reviews=Math.round(visits*.7);
 const rural=Math.round(visits*.11);
 return{E,enrolled,users,delivered,committed,poolWait,visits,answered,saved,reviews,ratingSum:reviews*4.6,rural}}
function totals(){const s=synth(S.day);if(!s)return null;const mine=S.bookings.filter(b=>b.status!=='cancelled'&&b.status!=='declined');const done=mine.filter(b=>b.status==='done');
 const me=S.me&&mine.length?1:0;
 const oth=S.others,othDone=oth.filter(o=>o.done),othH=oth.reduce((a,o)=>a+o.hours,0),othDoneH=othDone.reduce((a,o)=>a+o.hours,0);
 const t={...s,enrolled:s.enrolled+(S.me&&S.attest?1:0)+oth.length,users:s.users+me+oth.length,committed:Math.min(S.pool,s.committed+mine.reduce((a,b)=>a+b.hours,0)+othH),
  delivered:s.delivered+done.reduce((a,b)=>a+b.hours,0)+othDoneH,visits:s.visits+done.length+othDone.length,
  answered:s.answered+done.filter(b=>b.saved&&b.saved!=='skip').length+othDone.filter(o=>o.saved!=='skip').length,saved:s.saved+done.filter(b=>b.saved==='yes').length+othDone.filter(o=>o.saved==='yes').length,
  reviews:s.reviews+done.filter(b=>b.stars).length+othDone.length,ratingSum:s.ratingSum+done.reduce((a,b)=>a+(b.stars||0),0)+othDone.reduce((a,o)=>a+o.stars,0),
  rural:s.rural+done.filter(b=>b.rural).length,poolWait:s.poolWait+S.extraWait};
 t.active=oth.filter(o=>!o.done).length+S.bookings.filter(b=>b.status==='in_progress').length;
 t.byCat=Object.fromEntries(SERVICES.map(x=>[x.id,Math.round(s.delivered*SVC_W[x.id])+mine.filter(b=>b.svc===x.id).reduce((a,b)=>a+b.hours,0)+oth.filter(o=>o.svc===x.id).reduce((a,o)=>a+o.hours,0)]));
 const depts={};S.staff.forEach(p=>depts[p.dept]=(depts[p.dept]||0)+1);
 t.depts=Object.entries(depts).map(([dept,n])=>({dept,n,users:Math.round(t.users*n/s.E*(dept==='Personal support'?1.15:dept==='Administration'?.8:1))}));
 return t}

 const n=th.filter(m=>!m.me).length;setTimeout(()=>{th.push({me:false,text:REPLIES[c.who][Math.min(n,2)],t:fmtClock(new Date())});const busy=document.activeElement&&document.activeElement.id==='msg';if(busy)S.chat.draft=document.activeElement.value;render();if(busy){const m=$('#msg');m&&m.focus()}},1500)}

 else if(w.step===2)body=`<h3 style="margin-top:.5rem">Where is the help needed?</h3><p class="small muted">The postal code of the person you help. It can be different from yours.</p>

 else if(w.step===3){const dates=datesFor(w.cov.rural);if(!dates.includes(w.date))w.date=dates[0];const times=timesFor(w.date,w.cov.rural);if(!times.includes(w.time))w.time=times[0];const left=CAP-myHours()+(w.editId?S.bookings.find(b=>b.id===w.editId).hours:0);

${fitNote(w)}${scopeNote(w)}

 return head+body}

// ----- Data and security -----
function security(){return`<div class="page-head"><h2 class="rule">Data and security</h2><p class="muted" style="margin-top:.6rem">What SE Bridge collects, what it never collects, and who sees what.</p></div>
<div class="pipe"><div class="stage"><h4>1. HR uploads</h4><p class="small">Work email, department, benefits eligible. Nothing else.</p></div>
<div class="stage bridge"><h4>2. SE Bridge tokenizes</h4><p class="small">Each email becomes a keyed HMAC-SHA-256 token. Ineligible, invalid and duplicate rows are dropped.</p></div>
<div class="stage bridge"><h4>3. Stored</h4><p class="small">Token, department, bookings. Emails are discarded. Departments under 5 become “Other”.</p></div>
<div class="stage"><h4>4. HR sees</h4><p class="small">Totals only. Any count under 5 shows as “Fewer than 5”.</p></div></div>
<div class="g2" style="margin-top:1.1rem"><div class="panel"><h3>Try it</h3><p class="small muted">Type any email to see the token SE Bridge would keep. The key is created fresh in your browser and never leaves it.</p>
<label for="try">Email</label><input id="try" type="email" placeholder="name@example.ca" data-try><p class="small" style="margin-top:.7rem">Token: <code id="tryOut">type an email</code></p></div>
<div class="panel"><h3>Never collected</h3><p class="small">Names, diagnoses, who the person cared for is, proof of caregiving, income, or hours worked. Self-identification picks in SE Shield never leave the phone.</p></div></div>
<div class="panel tablewrap" style="margin-top:1.1rem"><h3>Who sees what</h3><table style="margin-top:.5rem"><thead><tr><th>Information</th><th>Employee</th><th>Provider and PSW</th><th>HR</th><th>SE Health evaluators</th></tr></thead><tbody>
<tr><td>Who booked</td><td>Their own</td><td>Yes, to deliver care</td><td>Never</td><td>Never</td></tr>
<tr><td>Address area, time, to-do list</td><td>Their own</td><td>Yes</td><td>Never</td><td>Never</td></tr>
<tr><td>Ratings and comments</td><td>Their own</td><td>Yes</td><td>Average rating, after 5 reviews</td><td>Average rating</td></tr>
<tr><td>Hours, visits, cost</td><td>Their own</td><td>Their visits</td><td>Totals</td><td>Totals</td></tr>
<tr><td>Department usage</td><td>No</td><td>No</td><td>Groups of 5 or more</td><td>Groups of 5 or more</td></tr></tbody></table></div>
<div class="g2" style="margin-top:1.1rem"><div class="panel"><h3>Assumptions</h3><p class="small">${money(RATE_DEFAULT)} per respite hour. 10 hours per employee. ${POOL_DEFAULT}-hour default pool. ${money(DAYCOST)} value per sick day saved. Only benefits-eligible staff take part. Book 3 hours to 7 days ahead, or 2 days ahead in rural areas. Free changes until 24 hours before a visit. Minimum group size of 5. Time machine growth is a synthetic model.</p></div>
<div class="panel"><h3>Sources</h3><p class="small">From SE Health’s Respite for All employer research: 62% of HR leaders interviewed by CCCE didn’t know their caregiver numbers; a proxy of 30–35% of a workforce are caregivers; in Phase 1, 61 of 180 closed applications were outside the service area, hours went to household tasks (47%), companionship (30%) and personal care (18%), and scheduling flexibility was the top frustration (39%). Also referenced there: Maple (2025) and the Canadian Human Rights Commission’s 2026 guide.</p>
<p class="small"><b>External benchmarks used in the model:</b> Ontario’s average hourly wage was $37.72 in 2025 (Financial Accountability Office of Ontario, from Statistics Canada’s Labour Force Survey). Full-time Canadians missed an average of 10.5 days of work in 2024 for illness and disability (Statistics Canada, as cited by iA Financial Group). Agency PSW rates in Ontario range from about $28 to $35 an hour (Closing the Gap Healthcare). 59% of caregivers are employed (Canadian Centre for Caregiving Excellence, Caring in Canada 2026).</p><p class="tiny muted">Team to verify external sources before presenting.</p></div></div>
<div class="panel" style="margin-top:1.1rem"><h3>Keeping it fair without asking for proof</h3><p class="small">Email verification with a 6-digit code before anyone can book. A 10-hour cap per employee and a fixed pool, so misuse can’t run up costs. Visits of 4 hours or less. Requests outside a PSW’s scope, like moving house or repairs, are flagged to the employee and the provider, who can decline them. Each booking includes a one-tap confirmation that it’s for someone the employee looks after. In Phase 1, SE Health found most requests were legitimate, so these guardrails are light by design.</p></div>
<div class="panel tablewrap" style="margin-top:1.1rem"><h3>PHIPA readiness check</h3><p class="small muted">Ontario’s Personal Health Information Protection Act applies to SE Health as a health information custodian, and SE Bridge would act on its behalf. HIPAA is US law and doesn’t apply here, but we used its safeguard checklist as a cross-check. This is a design self-check, not legal advice.</p>
<table style="margin-top:.5rem"><thead><tr><th>Requirement</th><th>Status</th><th>What production needs</th></tr></thead><tbody>
<tr><td>Collect only what’s needed</td><td><b>In place</b></td><td>Token, department and booking basics only. No names, diagnoses or proof of caregiving.</td></tr>
<tr><td>Employer can’t see health information</td><td><b>In place</b></td><td>Totals only, groups under 5 hidden. Enforce in the database, and release totals on a schedule to stop inference.</td></tr>
<tr><td>Agreement between SE Health and SE Bridge</td><td>Needed</td><td>A written agent or service provider agreement setting out what SE Bridge may do with the data.</td></tr>
<tr><td>Consent of the person receiving care</td><td>Needed</td><td>The employee shares a postal code and requests about someone else. Add notice, and have the provider confirm consent at the first visit.</td></tr>
<tr><td>Security safeguards</td><td>Partly</td><td>Encryption at rest, multi-factor sign-in for HR, role-based access, and a Canadian hosting region.</td></tr>
<tr><td>Audit trail of who accessed what</td><td>Needed</td><td>A tamper-evident access log. The bridge log in this demo is for presentation only.</td></tr>
<tr><td>Breach response</td><td>Needed</td><td>A plan to notify affected people and Ontario’s Information and Privacy Commissioner.</td></tr>
<tr><td>Access, correction and retention</td><td>Needed</td><td>A way for people to see and correct their records, and a schedule for deleting visit details.</td></tr>
<tr><td>Messages and reviews</td><td>Partly</td><td>They go to the provider only, with a warning not to share health details. In production, store them in the provider’s system.</td></tr>
<tr><td>Honest privacy wording</td><td><b>In place</b></td><td>Tokens are pseudonymous, not anonymous: SE Bridge can match a token when that person signs in. Feedback is described as anonymous to the employer.</td></tr>
</tbody></table></div>
<div class="panel" style="margin-top:1.1rem"><h3>Known limits</h3><p class="small">Provider integration is simulated. Phone sign-in would need one-time codes. Production needs a PHIPA and PIPEDA privacy review, Canadian data residency, and totals released on a fixed schedule to stop people inferring small changes.</p></div>`}

function simPanel(){const mine=S.bookings.filter(b=>['pending','booked','in_progress'].includes(b.status));
 return`<div class="sim" role="dialog" aria-label="Provider simulator"><h3>Provider simulator</h3><p class="small muted">Stands in for the provider’s own system, which sends SE Bridge a signal when a PSW arrives and when the visit ends.</p>

// ---------- Actions ----------
async function doCheck(){S.csv=$('#csv').value;S.err={};S.upload=null;const lines=S.csv.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
 if(lines.length<2&&!/@/.test(lines[0]||'')){S.err.csv='Paste at least one row: email, department, benefits eligible.';return render()}
 const start=/email/i.test(lines[0])?1:0,seen=new Set(),rows=[];let invalid=0,dup=0,notEligible=0;
 const have=new Set(S.staff.map(x=>x.token));let already=0;
 for(const l of lines.slice(start)){const[e='',d='',el='yes']=l.split(',').map(x=>x.trim());const k=e.toLowerCase();
  if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(k)){invalid++;continue}if(seen.has(k)){dup++;continue}seen.add(k);
  if(!/^(y|yes|true|1)$/i.test(el)){notEligible++;continue}rows.push({email:k,dept:normDept(d)})}
 if(!rows.length){S.err.csv='No eligible rows found. Check the email and benefits_eligible columns.';return render()}
 const fresh=[];for(const r of rows){r.token=await tokenFor(r.email);if(have.has(r.token))already++;else fresh.push(r)}
 const c={};S.staff.forEach(x=>c[x.dept]=(c[x.dept]||0)+1);fresh.forEach(r=>c[r.dept]=(c[r.dept]||0)+1);const merged=[...new Set(fresh.map(r=>r.dept))].filter(k=>c[k]<MIN);
 fresh.forEach(r=>r.deptOut=merged.includes(r.dept)?'Other':r.dept);
 S.preview={ready:fresh,already,invalid,dup,notEligible,merged};render()}
function doAdd(){const p=S.preview;const n=p.ready.length;S.staff=S.staff.concat(p.ready.map(r=>({token:r.token,dept:r.deptOut})));S.upload={added:n};S.preview=null;S.csv='';S.est.headcount=S.staff.length;
 log('—',`${n} emails turned into tokens, emails discarded`,`Headcount by department (${S.staff.length} staff)`);toast(`${n} staff added. Emails discarded.`);render()}
function newHires(){const names=[['noor','ahmed','Nursing','yes'],['oliver','chan','Personal support','yes'],['sofia','reyes','Nursing','yes'],['kai','thompson','Facilities','yes'],['zara','mensah','Personal support','no'],['liam','dubois','Administration','yes']];
 return['email,department,benefits_eligible',...names.map(([f,l,d,e])=>`${f}.${l}@maplecare.ca,${d},${e}`),`${FIRST[0]}.${LAST[0]}0@maplecare.ca,Nursing,yes`].join('\n')}
async function doSignin(){const em=$('#em').value.trim().toLowerCase();S.err={};if(!em){S.err.em='Enter your work email.';return render()}
 const tk=await tokenFor(em);const me=S.staff.find(s=>s.token===tk);if(!me){S.err.em='That email isn’t on your employer’s list. Check the spelling, or use the access code.';return render()}
 const [u,dom]=em.split('@');S.verify={me,code:String(Math.floor(100000+Math.random()*900000)),masked:`${u[0]}•••@${dom}`,tries:0};S.step='verify';
 log('Asked for a sign-in code',`Email matched to token ${tk.slice(0,8)}, code sent`,'Nothing');render()}
function doVerify(){const v=S.verify,code=($('#otp').value||'').replace(/\D/g,'');S.err={};
 if(v.tries>=5){S.err.otp='Too many tries. Send a new code.';return render()}
 if(code.length!==6){S.err.otp='Enter all 6 digits.';return render()}
 if(code!==v.code){v.tries++;S.err.otp=v.tries>=5?'Too many tries. Send a new code.':'That code doesn’t match. Check your email and try again.';return render()}
 S.me=v.me;S.verify=null;S.step=S.attest?'home':'about';log('Verified their email',`Token ${S.me.token.slice(0,8)} signed in`,'Nothing');openedApp();render()}
function openedApp(){if(S.bookings.some(b=>b.status==='done'&&!b.reviewed)){S.showReview=true;S.review={stars:0,saved:null,comment:''}}}
function doBook(){const w=S.wiz;const start=at(w.date,w.time);const{min,max}=windowFor(w.cov.rural);S.err={};
 if(!w.editId&&!$('#purpose').checked){S.err.book='Tick the box to confirm who the visit is for.';return render()}
 if(start<min||start>max){S.err.book=w.cov.rural?'Rural visits need at least 2 days’ notice, up to 7 days ahead.':'Visits need at least 3 hours’ notice, up to 7 days ahead.';return render()}
 const t=totals();
 if(w.editId){const b=S.bookings.find(x=>x.id===w.editId);if(!canChange(b)){S.err.book='Changes close 24 hours before the visit.';return render()}
  const extra=w.hours-b.hours;if(extra>0&&t.committed+extra>S.pool){S.err.book='The employer’s pool is full, so you can’t add hours right now.';return render()}
  Object.assign(b,{date:w.date,time:w.time,hours:w.hours});log(`Moved the visit to ${fmtDate(w.date)}`,`Token ${S.me.token.slice(0,8)}: visit moved, ${b.provider} notified`,extra?`${extra>0?'+':''}${extra} hours committed`:'Nothing changed');toast(`Visit moved to ${fmtDate(w.date)} at ${fmtTime(w.time)}`)}
 else{if(t.committed+w.hours>S.pool){S.err.book='Your employer’s respite pool is full. You’ve been added to the waitlist.';log('Tried to book','Pool full, waitlisted','Waitlist +1');return render()}
  const remote=w.cov.rural,worker=remote?null:ROSTER[w.cov.provider][Math.floor(Math.random()*4)];
  S.bookings.push({id:Math.random().toString(36).slice(2),svc:w.svc,postal:w.cov.postal,rural:remote,provider:w.cov.provider,worker,date:w.date,time:w.time,hours:w.hours,tasks:[...w.tasks],status:remote?'pending':'booked'});
  if(remote){log(`Requested ${w.hours} h of ${svc(w.svc).name.toLowerCase()} in a remote area`,`Token ${S.me.token.slice(0,8)}: request sent to a ${w.cov.provider} coordinator for approval (travel distance)`,`+${w.hours} hours held from the pool`);toast(`Request sent. A ${w.cov.provider} coordinator will confirm, usually within 1 business day.`)}
  else{log(`Booked ${w.hours} h of ${svc(w.svc).name.toLowerCase()}`,`Token ${S.me.token.slice(0,8)} sent to ${w.cov.provider} with a ${w.tasks.length}-item to-do list`,`+${w.hours} hours committed from the pool`);toast(`${worker} from ${w.cov.provider} is booked for ${fmtDate(w.date)} at ${fmtTime(w.time)}`)}}
 S.wiz=null;render()}

document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
 if(d.go){S.view=d.go;S.simOpen=false;render();scrollTo({top:0});return}
 if(d.tab){S.pulseTab=d.tab;S.view='pulse';render();return}
 if(d.chip!==undefined){b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');return}
 if(d.svc){S.wiz.svc=d.svc;render();return}
 if(d.goto){S.wiz.step=+d.goto;render();return}
 if(d.rmtask){S.wiz.tasks.splice(+d.rmtask,1);render();return}
 if(d.sethours){S.wiz.hours=+d.sethours;toast(`Changed to ${d.sethours} hours`);render();return}
 if(d.star){S.review.stars=+d.star;render();return}
 if(d.saved){S.review.saved=d.saved;render();return}
 if(d.change){const x=S.bookings.find(v=>v.id===d.change);S.wiz={step:3,editId:x.id,svc:x.svc,postal:x.postal,cov:{postal:x.postal,rural:x.rural,provider:x.provider},date:x.date,time:x.time,hours:x.hours,tasks:x.tasks};render();return}
 if(d.cancel){const x=S.bookings.find(v=>v.id===d.cancel);if(!canChange(x))return toast('Changes close 24 hours before the visit.');x.status='cancelled';log('Cancelled a visit',`Token ${S.me.token.slice(0,8)}: ${x.hours} h returned`,`−${x.hours} hours committed`);toast(`Visit cancelled. ${x.hours} hours are back in your balance.`);render();return}
 if(d.approve){const x=S.bookings.find(v=>v.id===d.approve);x.status='booked';x.worker=ROSTER[x.provider][Math.floor(Math.random()*4)];log('Remote booking approved',`${x.provider} coordinator approved and assigned ${x.worker}`,'Nothing new');toast(`Approved. ${x.worker} from ${x.provider} is booked.`);render();return}
 if(d.decline){const x=S.bookings.find(v=>v.id===d.decline);x.status='declined';log('Remote booking not approved',`${x.provider} coordinator declined (no PSW for that distance), ${x.hours} h returned`,`−${x.hours} hours held, unmet demand +1 (remote)`);toast(`${x.provider} couldn’t approve this one. Hours returned.`);render();return}
 if(d.chat){const[id,who]=d.chat.split('|');S.chat={id,who,draft:''};render();return}
 if(d.arrive){const x=S.bookings.find(v=>v.id===d.arrive);x.status='in_progress';x.startedAt=Date.now();log(`${x.worker} arrived`,`${x.provider} started the visit for token ${S.me.token.slice(0,8)}`,'Live count +1 (shown once 5 or more)');toast(`${x.worker} has arrived and started at ${fmtClock(new Date())}`);render();return}
 if(d.finish){const x=S.bookings.find(v=>v.id===d.finish);x.status='done';if(S.chat&&S.chat.id===x.id)S.chat=null;log('Visit finished',`${x.provider} logged ${x.hours} h for token ${S.me.token.slice(0,8)}`,`+${x.hours} hours delivered (no name)`);toast('Visit finished. The review appears next time SE Shield opens.');render();return}
 const a=d.act;if(!a)return;
 switch(a){
 case'toggleSim':S.simOpen=!S.simOpen;break;
 case'useMid':S.pool=Math.max(10,Math.round(estCalc().mid.hours));toast(`Pool set to ${S.pool} hours`);break;
 case'useHigh':S.pool=Math.max(10,Math.round(estCalc().high.hours));toast(`Pool set to ${S.pool} hours`);break;
 case'sample':S.csv=sampleCSV();S.preview=null;S.upload=null;break;
 case'newHires':S.csv=newHires();S.preview=null;S.upload=null;break;
 case'check':return doCheck();
 case'add':doAdd();return;
 case'reupload':S.upload=null;break;
 case'demoEmail':$('#em').value=DEMO_EMAIL;return;
 case'signin':return doSignin();
 case'verifyCode':doVerify();return;
 case'closeChat':S.chat=null;break;
 case'sendMsg':sendMsg();return;
 case'resend':S.verify.code=String(Math.floor(100000+Math.random()*900000));S.verify.tries=0;S.err={};toast('New code sent');break;
 case'signout':S.me=null;S.verify=null;S.chat=null;S.step='signin';S.wiz=null;S.showReview=false;break;
 case'attest':if(!$('#attest').checked){S.err={attest:'Tick the box to confirm. That’s all we ask.'};break}S.attest=true;S.err={};S.step='home';log('Confirmed they help someone',`Token ${S.me.token.slice(0,8)} enrolled, 10 hours`,'Signed up +1 (total only)');break;
 case'startWiz':S.wiz={step:1,svc:null,postal:'',cov:null,date:'',time:'',hours:2,tasks:[]};S.err={};break;
 case'wizBack':if(S.wiz.step===1||(S.wiz.editId&&S.wiz.step===3))S.wiz=null;else S.wiz.step--;S.err={};break;
 case'checkPc':{const v=$('#pc').value;S.wiz.postal=v;if(!postalOk(v)){S.err={pc:'Enter a full Canadian postal code, like M4C 1B5.'};S.wiz.cov=null}else{S.err={};S.wiz.cov=coverage(v)}break}
 case'wizNext':S.wiz.step++;S.err={};break;
 case'addTask':{const v=$('#task').value;if(v)S.wiz.tasks.push(v);break}
 case'addNote':{const v=$('#note').value.trim();if(v)S.wiz.tasks.push(v.slice(0,120));break}
 case'book':doBook();return;
 case'submitReview':{const x=S.bookings.find(v=>v.status==='done'&&!v.reviewed);const r=S.review,c=(r.comment||'').trim();x.reviewed=true;x.stars=r.stars||null;x.saved=r.saved||null;S.showReview=false;S.err={};
  const parts=[x.stars?`${x.stars} stars`:'',x.saved?`sick day saved: ${x.saved}`:'',c?`comment sent to ${x.provider}`:''].filter(Boolean);
  log('Sent feedback on the visit',`Token ${S.me.token.slice(0,8)}: ${parts.length?parts.join(', '):'no answers given'}`,'Average rating and sick days saved, after 5 answers');toast('Thank you. Your feedback is anonymous to your employer.');break}
 case'later':S.showReview=false;S.err={};break;
 case'reopen':if(!S.me){toast('Sign in to SE Shield first.');break}openedApp();if(!S.showReview)toast('No finished visit to review yet.');S.view=S.view==='split'?'split':'shield';S.simOpen=false;break;
 case'othersStart':{if(!S.staff.length){toast('Add staff first.');break}let started=0,waited=0;for(let i=0;i<8;i++){const h=2+Math.floor(Math.random()*3);if(totals().committed+h>S.pool){waited++;continue}const r=Math.random();S.others.push({hours:h,svc:Math.random()<.6?'household':Math.random()<.6?'companion':'personal',done:false,saved:r<.6?'yes':r<.9?'no':'skip',stars:4+Math.round(Math.random())});started++}
  S.extraWait+=waited;log('—',`${started} visits started for other staff${waited?`, ${waited} waitlisted (pool full)`:''}`,started?'Live count and pool hours updated':'Waitlist +'+waited);toast(waited?`${started} visits started. ${waited} waitlisted because the pool is full.`:`${started} visits started.`);break}
 case'othersEnd':{const open=S.others.filter(o=>!o.done);const h=open.reduce((a,o)=>a+o.hours,0);open.forEach(o=>o.done=true);log('—',`${open.length} visits finished, ${h} hours logged`,`+${h} hours delivered, spend updated`);toast(`${open.length} visits finished. ${h} hours added to the dashboard.`);break}
 case'play':if(S.playing){clearInterval(S.playing);S.playing=null;break}if(S.day>=90)S.day=1;S.playing=setInterval(()=>{S.day++;if(S.day>=90){S.day=90;clearInterval(S.playing);S.playing=null}if(S.view==='pulse'&&S.pulseTab==='dash')render();else{clearInterval(S.playing);S.playing=null}},70);break;
 case'jump90':S.day=90;break;
 case'reset':if(!confirm('Clear all demo data?'))return;if(S.playing)clearInterval(S.playing);Object.assign(S,{pool:POOL_DEFAULT,rate:RATE_DEFAULT,csv:'',preview:null,upload:null,staff:[],me:null,attest:false,step:'signin',wiz:null,bookings:[],showReview:false,others:[],extraWait:0,verify:null,chat:null,threads:{},day:1,playing:null,log:[],err:{},simOpen:false});await initKey();toast('Demo reset.');break}
 render()});
